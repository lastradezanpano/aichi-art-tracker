name: Update and deploy

on:
  push:
    branches: [main]
  schedule:
    # 毎日 7:00 JST (UTC 22:00)。GitHub側の混雑で数分〜数十分遅れることがある
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update event data
        run: python scripts/update_events.py
      - name: Commit updated data
        run: |
          if git diff --quiet -- data/events.json data/scrape_status.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/scrape_status.json
          git commit -m "chore: update events"
          git push
      - name: Prepare site files
        run: |
          mkdir _site
          cp index.html _site/
          cp -r data _site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
